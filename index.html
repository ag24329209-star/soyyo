<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Shower</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6EBD9;
    --honey:#D99A3E;
    --honey-dark:#B87A28;
    --brown:#6B4A2E;
    --brown-soft:#8A6644;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--cream);
    font-family:'Quicksand',sans-serif;
    min-height:100%;
    overflow-x:hidden;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }

  /* ---------- envelope screen ---------- */
  #envelope-screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:22px;
    cursor:pointer;
    padding:20px;
    text-align:center;
    transition:opacity .5s ease;
  }
  #envelope-screen.hidden{ display:none; }
  .env-wrap{ perspective:800px; }
  .envelope{
    width:220px; height:150px;
    position:relative;
    animation: float 3.2s ease-in-out infinite;
  }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .env-body{
    position:absolute; inset:0;
    background: var(--honey);
    border-radius:8px;
    box-shadow: 0 10px 24px rgba(107,74,46,.25);
  }
  .env-flap{
    position:absolute; top:0; left:0; right:0; height:0;
    border-left:110px solid transparent;
    border-right:110px solid transparent;
    border-top:78px solid var(--honey-dark);
    transform-origin:top;
    transition: transform .6s cubic-bezier(.6,-0.2,.3,1.3);
    border-top-left-radius:6px;
    border-top-right-radius:6px;
  }
  .env-heart{
    position:absolute; left:50%; top:48%;
    transform:translate(-50%,-50%);
    font-size:1.6rem;
  }
  .tap-hint{
    color:var(--brown-soft);
    font-size:1rem;
  }
  .tap-hint b{ color:var(--brown); }

  /* ---------- invitation card ---------- */
  #card-screen{
    display:none;
    opacity:0;
    transition:opacity .7s ease;
  }
  #card-screen.show{ display:flex; opacity:1; justify-content:center; }
  .card{
    width:100%;
    max-width:480px;
    position:relative;
    overflow:hidden;
    padding-bottom:40px;
  }
  .drip{ width:100%; display:block; }
  .content{ padding: 8px 30px 0; text-align:center; position:relative; }

  .bee{
    position:absolute;
    animation: buzz 5s ease-in-out infinite;
    opacity:.9;
  }
  @keyframes buzz{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(6px,-10px) rotate(8deg); }
    50%{ transform:translate(-4px,-4px) rotate(-6deg); }
    75%{ transform:translate(4px,6px) rotate(4deg); }
  }

  .hive-row{ display:flex; justify-content:center; margin: 6px 0 2px; }
  .greeting{
    font-family:'Fraunces',serif; font-style:italic; font-weight:500;
    font-size:1.25rem; color:var(--honey-dark); margin-top:6px;
  }
  h1.baby{
    font-family:'Fraunces',serif; font-weight:700; font-size:3.9rem;
    color:var(--brown-soft); line-height:.9; letter-spacing:1px; margin:2px 0 16px;
  }
  .lead{ font-size:1rem; color:var(--brown-soft); }
  .shower{
    font-family:'Fraunces',serif; font-weight:700; font-size:1.9rem;
    color:var(--brown); letter-spacing:1px; margin:2px 0;
  }
  .sub{ font-size:1.02rem; color:var(--brown-soft); margin-bottom:18px; }
  .msg{
    font-size:.92rem; color:var(--brown-soft); line-height:1.5;
    max-width:360px; margin:0 auto 24px;
  }

  .details{ display:flex; justify-content:center; gap:0; margin:8px auto 22px; max-width:400px; }
  .detail{ flex:1; padding:0 8px; }
  .detail .label{ font-family:'Fraunces',serif; font-size:1.4rem; color:var(--brown); font-weight:700; }
  .detail .value{ font-size:.95rem; color:var(--brown-soft); margin-top:2px; }
  .divider{ width:1px; background:var(--honey); align-self:stretch; margin-top:6px; }

  .parents{
    font-family:'Fraunces',serif; font-style:italic; font-size:1.25rem;
    color:var(--honey-dark); margin:10px 0 4px;
  }

  /* ---------- RSVP ---------- */
  .rsvp{ margin-top:22px; }
  .rsvp-title{
    font-family:'Fraunces',serif; font-style:italic; font-size:1.15rem;
    color:var(--brown); margin-bottom:12px;
  }
  .rsvp-buttons{ display:flex; justify-content:center; gap:12px; }
  .rsvp-btn{
    border:2px solid var(--honey-dark);
    background:transparent;
    color:var(--brown);
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:.95rem;
    padding:10px 20px;
    border-radius:30px;
    cursor:pointer;
    transition: background .25s ease, color .25s ease, transform .15s ease;
  }
  .rsvp-btn:active{ transform:scale(.96); }
  .rsvp-btn.selected{ background:var(--honey-dark); color:#fff; }
  .rsvp-response{
    margin-top:14px;
    font-size:.95rem;
    color:var(--honey-dark);
    min-height:1.3em;
  }

  .bees-row{ display:flex; justify-content:center; gap:20px; margin-top:22px; }
  .bees-row svg{ animation: buzz 4s ease-in-out infinite; }
  .bees-row svg:nth-child(2){ animation-delay:.6s; }
  .bees-row svg:nth-child(3){ animation-delay:1.2s; }
</style>
</head>
<body>

<div id="envelope-screen">
  <div class="env-wrap">
    <div class="envelope">
      <div class="env-body"></div>
      <div class="env-flap" id="flap"></div>
      <div class="env-heart">🍯</div>
    </div>
  </div>
  <div class="tap-hint">Toca el sobre para <b>abrir tu invitación</b></div>
</div>

<div id="card-screen">
  <div class="card">
    <svg class="drip" viewBox="0 0 480 90" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#E8A83A"/>
          <stop offset="100%" stop-color="#C97F1F"/>
        </linearGradient>
      </defs>
      <path d="M0,0 H480 V35
        C470,35 465,55 455,55 C445,55 440,35 430,35
        C420,35 415,70 405,70 C395,70 390,35 380,35
        C370,35 365,50 355,50 C345,50 340,35 330,35
        C320,35 315,60 305,60 C295,60 290,35 280,35
        C270,35 265,45 255,45 C245,45 240,35 230,35
        C220,35 215,75 205,75 C195,75 190,35 180,35
        C170,35 165,55 155,55 C145,55 140,35 130,35
        C120,35 115,48 105,48 C95,48 90,35 80,35
        C70,35 65,65 55,65 C45,65 40,35 30,35
        C20,35 15,42 5,42 C2,42 0,38 0,35 Z" fill="url(#g)"/>
    </svg>

    <div class="content">
      <svg class="bee" style="top:100px; left:10px; width:24px;" viewBox="0 0 26 20"><ellipse cx="13" cy="10" rx="9" ry="7" fill="#F2C14E" stroke="#6B4A2E" stroke-width="1.2"/><line x1="6" y1="10" x2="20" y2="10" stroke="#6B4A2E" stroke-width="1.2"/></svg>
      <svg class="bee" style="top:60px; right:14px; width:22px; animation-delay:1s;" viewBox="0 0 26 20"><ellipse cx="13" cy="10" rx="9" ry="7" fill="#F2C14E" stroke="#6B4A2E" stroke-width="1.2"/><line x1="6" y1="10" x2="20" y2="10" stroke="#6B4A2E" stroke-width="1.2"/></svg>

      <div class="hive-row">
        <svg width="66" height="56" viewBox="0 0 70 60">
          <path d="M35 2 C20 2 12 16 12 30 C12 44 20 58 35 58 C50 58 58 44 58 30 C58 16 50 2 35 2 Z" fill="#D99A3E" stroke="#B87A28" stroke-width="1.5"/>
          <line x1="14" y1="15" x2="56" y2="15" stroke="#B87A28" stroke-width="1.2"/>
          <line x1="12" y1="28" x2="58" y2="28" stroke="#B87A28" stroke-width="1.2"/>
          <line x1="14" y1="41" x2="56" y2="41" stroke="#B87A28" stroke-width="1.2"/>
          <ellipse cx="35" cy="44" rx="7" ry="10" fill="#6B4A2E"/>
        </svg>
      </div>

      <div class="greeting">hola, mundo</div>
      <h1 class="baby">BABY</h1>

      <div class="lead">Te invitamos al</div>
      <div class="shower">BABY SHOWER</div>
      <div class="sub">de nuestro pequeño</div>

      <div class="msg">Pronto llegará nuestro bebé, por eso queremos compartir contigo esta fecha especial.</div>

      <div class="details">
        <div class="detail"><div class="label">26</div><div class="value">Día</div></div>
        <div class="divider"></div>
        <div class="detail"><div class="label">Sept.</div><div class="value">Mes</div></div>
        <div class="divider"></div>
        <div class="detail"><div class="label">3:00</div><div class="value">de la tarde</div></div>
      </div>

      <div class="parents">Con cariño, Natalia y Alejandro</div>

      <div class="rsvp">
        <div class="rsvp-title">¿Nos acompañas?</div>
        <div class="rsvp-buttons">
          <button class="rsvp-btn" id="btn-si">Sí, ahí estaré 🍯</button>
          <button class="rsvp-btn" id="btn-no">No podré ir</button>
        </div>
        <div class="rsvp-response" id="rsvp-response"></div>
      </div>

      <div class="bees-row">
        <svg width="24" height="18" viewBox="0 0 26 20"><ellipse cx="13" cy="10" rx="9" ry="7" fill="#F2C14E" stroke="#6B4A2E" stroke-width="1.2"/><line x1="6" y1="10" x2="20" y2="10" stroke="#6B4A2E" stroke-width="1.2"/></svg>
        <svg width="24" height="18" viewBox="0 0 26 20"><ellipse cx="13" cy="10" rx="9" ry="7" fill="#F2C14E" stroke="#6B4A2E" stroke-width="1.2"/><line x1="6" y1="10" x2="20" y2="10" stroke="#6B4A2E" stroke-width="1.2"/></svg>
        <svg width="24" height="18" viewBox="0 0 26 20"><ellipse cx="13" cy="10" rx="9" ry="7" fill="#F2C14E" stroke="#6B4A2E" stroke-width="1.2"/><line x1="6" y1="10" x2="20" y2="10" stroke="#6B4A2E" stroke-width="1.2"/></svg>
      </div>
    </div>
  </div>
</div>

<script>
  var envScreen = document.getElementById('envelope-screen');
  var cardScreen = document.getElementById('card-screen');
  var flap = document.getElementById('flap');

  envScreen.addEventListener('click', function(){
    flap.style.transform = 'rotateX(180deg)';
    setTimeout(function(){
      envScreen.classList.add('hidden');
      cardScreen.classList.add('show');
    }, 550);
  });

  function setRsvp(value){
    try{ localStorage.setItem('rsvp-choice', value); }catch(e){}
  }
  function getRsvp(){
    try{ return localStorage.getItem('rsvp-choice'); }catch(e){ return null; }
  }

  var btnSi = document.getElementById('btn-si');
  var btnNo = document.getElementById('btn-no');
  var response = document.getElementById('rsvp-response');

  function paint(choice){
    btnSi.classList.toggle('selected', choice === 'si');
    btnNo.classList.toggle('selected', choice === 'no');
    if(choice === 'si'){ response.textContent = '¡Qué alegría! Te esperamos 🐝'; }
    else if(choice === 'no'){ response.textContent = 'Gracias por avisarnos, te extrañaremos.'; }
    else{ response.textContent = ''; }
  }

  btnSi.addEventListener('click', function(){ setRsvp('si'); paint('si'); });
  btnNo.addEventListener('click', function(){ setRsvp('no'); paint('no'); });

  paint(getRsvp());
</script>
</body>
</html>
